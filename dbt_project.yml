name: 'hmda_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  hmda_project:
    staging:
      +materialized: view      # Change to 'table' only if querying views incurs heavy cost/latency in raw source
    marts:
      +materialized: table

seeds:
  hmda_project:
    fips_reference_table:
      +column_types:
        "StCnty FIPS Code": string
        "State FIPS Code": string
        "County Code": string
        "State Code": string
        "County Name": string
        "State Name": string
