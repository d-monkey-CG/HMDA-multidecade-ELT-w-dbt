version: 2

sources:
  - name: raw_hmda
    database: hmda-data-project  
    dataset: HMDA_ALL
    tables:
      - name: hmda_post2017

models:
  - name: stg_post2017
    description: "HMDA post2017 dbt model"
    columns:
      - name: activity_year
        tests:
          - not_null

      - name: state_code
        tests:
          - not_null

      - name: loan_type
        tests:
          - not_null

      - name: action_taken
        tests:
          - not_null
