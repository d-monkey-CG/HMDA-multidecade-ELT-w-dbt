version: 2

sources:
  - name: raw_hmda
    database: hmda-data-project
    dataset: HMDA_ALL
    tables:
      - name: hmda_pre2018

models:
  - name: stg_pre2018
    description: "HMDA pre-2018 staging model"
    columns:
      - name: as_of_year
        tests:
          - not_null

      - name: state_code
        tests:
          - not_null

      - name: loan_type
        tests:
          - not_null

      - name: action_taken
        tests:
          - not_null
